<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Where the JS plugins run (js/plugin-runtime.js), inside an iframe with
     sandbox="allow-scripts" and no allow-same-origin. The app creates ONE
     frame per plugin (helpers included) and identifies each plugin by the
     frame that sent the message, never by its own claims. This policy lets the
     plugin's code compile ('unsafe-eval') and forbids everything else:
     no network, images, frames or forms of its own. The app does the
     network for it through Rust `pluginFetch` (NetGuard). Production builds
     also enforce a strict CSP (strictCspPlugin in vite.config.ts). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; base-uri 'none'; form-action 'none'">
<title>OpenTV plugins</title>
</head>
<body>
<script src="js/plugin-runtime.js"></script>
</body>
</html>
