[package]
name = "opentv-tauri"
version = "2.0.0-alpha.1"
description = "OpenTV v2 — Native Windows PC wrapper (Tauri v2 + embedded Rust core)"
authors = ["TECHPOINT Software"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentv-core = { path = "../../../core/crates/opentv-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false }
url = "2"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Same version Tauri/wry use, so `with_webview` controller types unify (status bar toggle).
webview2-com = "0.39"
# Same windows-core webview2-com uses, for `Interface::cast` on WebView2 COM types.
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
