[package]
name = "opentv-android"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "opentv_service"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
opentv-core = { path = "../opentv-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
